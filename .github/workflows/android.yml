# Compila l'app e lancia i test a ogni modifica di android/. L'APK di debug resta come artifact del run.
name: App Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Database da includere nell'APK
        # Se la release non esiste ancora l'APK nasce senza orari e li scarica al primo avvio.
        run: |
          mkdir -p out
          gh release download db -p timetable.db.gz -p manifest.json -D out || echo "release db non trovata"

      - name: Test e build
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      - uses: actions/upload-artifact@v5
        with:
          name: orari-bus-roma-debug
          path: android/app/build/outputs/apk/debug/*.apk
